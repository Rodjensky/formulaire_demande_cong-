name = "leave-management-platform"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "leave-management-db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID_HERE"

# Assets / Static files
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Environment Variables (Non-sensitive)
[vars]
APP_URL = "https://conges.votredomaine.com"
EMAIL_FROM = "Plateforme Congés <noreply@votredomaine.com>"
